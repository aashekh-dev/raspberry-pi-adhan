name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Audio tests fake only the OS tools, and exercise playback with Python
      # child processes; no player or Bluetooth hardware is required.
      - name: Run test suite
        run: pytest -q

      - name: Check installer syntax
        run: bash -n deploy/install.sh deploy/setup-audio.sh
